version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
    time: "11:00"
  open-pull-requests-limit: 10
  versioning-strategy: increase-if-necessary
  # pnpm rejects versions younger than its 1 day minimumReleaseAge
  cooldown:
    default-days: 2
  ignore:
    # @wdio/jasmine-framework patches private Jasmine internals (Spec, Suite)
    # that Jasmine 7 removed. Remove once the adapter supports Jasmine 7.
    - dependency-name: "jasmine"
      update-types: ["version-update:semver-major"]
    - dependency-name: "@types/jasmine"
      update-types: ["version-update:semver-major"]
  groups:
    patch-deps-updates-main:
      update-types:
        - "patch"
    minor-deps-updates-main:
      update-types:
        - "minor"
    major-deps-updates-main:
      update-types:
        - "major"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    time: "11:00"
  open-pull-requests-limit: 10
  groups:
    patch-deps-updates:
      update-types:
        - "patch"
    minor-deps-updates:
      update-types:
        - "minor"
    major-deps-updates:
      update-types:
        - "major"
- package-ecosystem: docker
  directory: "/e2e/wdio/display-server/docker"
  schedule:
    interval: weekly
    time: "11:00"
  open-pull-requests-limit: 10
  groups:
    docker-patch-updates:
      update-types:
        - "patch"
    docker-minor-updates:
      update-types:
        - "minor"
    docker-major-updates:
      update-types:
        - "major"
