name: Block Compromised Commits

# Guard against the 2026-11-11 wdio-bot compromise and similar supply-chain changes.
#
# pull_request_target runs the copy of this file from the base branch, so a pull
# request cannot edit the guard to make it pass. The job never runs code from the
# pull request: it only reads git objects (git log, git diff) with read-only access.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: block-compromised-commits-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Every label event runs the full check on purpose: a skipped job counts as passing
        # for a required check and could hide an earlier failure. A partial clone keeps it cheap.
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Check commits and changes of the pull request
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          OVERRIDE_LABEL: allow-sensitive-changes
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "refs/pull/${PR_NUMBER}/head"
          # Check the commit this event is for, not whatever the PR ref points to now.
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --quiet origin "${HEAD_SHA}" || true
          fi
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            echo "::error::Commit ${HEAD_SHA} is no longer available (force-pushed). The run for the new head checks it."
            exit 1
          fi
          head="${HEAD_SHA}"
          base="origin/${BASE_REF}"
          fail=0
          override=0
          case ",${LABELS}," in *",${OVERRIDE_LABEL},"*) override=1 ;; esac
          # Escape values for workflow commands, so file names cannot break an annotation.
          esc_data() { local s=$1; s=${s//'%'/'%25'}; s=${s//$'\r'/'%0D'}; s=${s//$'\n'/'%0A'}; printf '%s' "$s"; }
          esc_prop() { local s; s=$(esc_data "$1"); s=${s//:/'%3A'}; s=${s//,/'%2C'}; printf '%s' "$s"; }

          # 1. Commits from the 2026-11-11 incident, also when rebased or cherry-picked.
          #    Match: any commit authored or committed by wdio-bot (both of its identities)
          #    since the day of the attack, an attack commit message, or the patch-id
          #    (content fingerprint) of a known attack commit.
          since=1794355200 # 2026-11-11T00:00:00Z
          # Whole subject only (optional " (#123)" from a squash merge), so "ci: cleanup old jobs" is fine.
          attack_msg='^(chore: add ci helper|ci: restore|ci: cleanup|docs: add dependency audit notes)( \(#[0-9]+\))?$'
          bad_patch_ids="0b60584cde25231f7392af8ea098842bf321e3e3 806080b03b76e63597621d5bb87163f4d41b5bdd 2f339da03c48504aad5915f93193fa767a0acb9a fbf079d559c652afc379a5c9288ed50030b3f0f2"
          incident=""
          # All commits, merges included: a merge made by wdio-bot must fail too.
          for c in $(git rev-list "${base}..${head}"); do
            # NUL-separated, so a "|" or other character in a name cannot shift the fields.
            { IFS= read -r -d '' ae; IFS= read -r -d '' ce; IFS= read -r -d '' an; IFS= read -r -d '' cn
              IFS= read -r -d '' at; IFS= read -r -d '' ct; IFS= read -r -d '' subject; } \
              < <(git log -1 --format='%ae%x00%ce%x00%an%x00%cn%x00%at%x00%ct%x00%s%x00' "$c")
            [[ "$at" =~ ^[0-9]+$ ]] || at=$since # fail closed
            [[ "$ct" =~ ^[0-9]+$ ]] || ct=$since
            pid=""
            if [ "$(git rev-list --no-walk --count --min-parents=2 "$c")" = 0 ]; then # a merge has no single patch
              pid=$(git show "$c" | git patch-id --stable | cut -d' ' -f1)
            fi
            is_bot=0
            for id in "$ae" "$ce"; do
              case "$id" in 72550141+wdio-bot@users.noreply.github.com|bot@webdriver.io) is_bot=1 ;; esac
            done
            for name in "$an" "$cn"; do
              [[ "$name" =~ ^WebdriverIO\ (Release\ )?Bot$ ]] && is_bot=1
            done
            reason=""
            if [ "$is_bot" = 1 ] && { [ "$at" -ge "$since" ] || [ "$ct" -ge "$since" ]; }; then reason+="wdio-bot since 2026-11-11, "; fi
            if [[ "$subject" =~ $attack_msg ]]; then reason+="attack message, "; fi
            if [[ " ${bad_patch_ids} " == *" ${pid} "* ]]; then reason+="attack patch-id, "; fi
            if [ -n "$reason" ]; then
              incident+="  ${c:0:10} ${subject} [${reason%, }]"$'\n'
            fi
          done
          if [ -n "$incident" ]; then
            echo "::error::This branch contains commits by wdio-bot since 2026-11-11 or from the wdio-bot compromise. Rebase onto ${BASE_REF}: git fetch upstream && git rebase upstream/${BASE_REF}"
            printf '%s' "$incident"
            fail=1
          fi

          # Added lines, read inside hunks only: a code line that starts with "+" must not be
          # mistaken for the "+++ b/file" header.
          added=$(git diff --no-color --unified=0 "${base}...${head}" \
            | awk '/^diff --git /{h=0} /^@@ /{h=1; next} h && /^\+/{print substr($0, 2)}')

          # 2. Hidden shell scripts (for example .ci-abc123.sh). No such file exists in the repo.
          #    -z and core.quotePath=false keep non-ASCII names unquoted; compare in lowercase.
          while IFS= read -r -d '' f; do
            lower=$(printf '%s' "$f" | tr '[:upper:]' '[:lower:]')
            if [[ "$lower" =~ (^|/)\.[^/]+\.(sh|bash|zsh|ksh)$ ]]; then
              echo "::error file=$(esc_prop "$f")::Hidden shell script added or changed: $(esc_data "$f")"; fail=1
            elif [[ "$lower" =~ \.(sh|bash|zsh|ksh)$ ]]; then
              echo "::warning file=$(esc_prop "$f")::Shell script added or changed. Review it with care."
            fi
          done < <(git -c core.quotePath=false diff -z --name-only --diff-filter=AMR "${base}...${head}")

          mb=$(git merge-base "$base" "$head")
          sensitive() { # $1 = message; an error unless the override label is set
            local msg; msg=$(esc_data "$1")
            if [ "$override" = 1 ]; then echo "::warning::${msg} (allowed by label ${OVERRIDE_LABEL})"
            else echo "::error::${msg}. A maintainer must review it and add the label '${OVERRIDE_LABEL}'."; fail=1; fi
          }

          # 3. npm lifecycle scripts that run on install or pack (the root postinstall runs every "postinstall:*").
          #    Both versions are parsed with jq, so escaped keys and line breaks cannot hide a hook.
          lifecycle='^(pre|post)?(install|prepare|pack|publish|publishOnly)(:.*)?$|^dependencies$'
          remote_spec='(git\+|git:|github:|gitlab:|bitbucket:|https?:|file:|link:)'
          hooks_of() { jq -cS --arg re "$lifecycle" '(.scripts // {}) | with_entries(select(.key | test($re)))'; }
          # Dependencies from git, URLs or local paths (they can run their own install scripts),
          # and the pnpm build permissions in package.json.
          deps_of() {
            jq -cS --arg re "^${remote_spec}" '{
              remote: ([(.dependencies, .devDependencies, .optionalDependencies, .peerDependencies,
                         .overrides, .resolutions, (.pnpm // {}).overrides)
                        | select(type == "object") | to_entries[]
                        | select((.value | type) == "string" and (.value | test($re)))
                        | "\(.key)=\(.value)"] | unique),
              build: ((.pnpm // {}) | {onlyBuiltDependencies, neverBuiltDependencies, ignoredBuiltDependencies,
                                       allowBuilds, dangerouslyAllowAllBuilds})
            }'
          }
          while IFS= read -r -d '' f; do
            new=$(git show "${head}:${f}" | hooks_of) || { sensitive "Cannot parse ${f}"; continue; }
            old=$( { git show "${mb}:${f}" 2>/dev/null || echo '{}'; } | hooks_of) || old='{}'
            if [ "$old" != "$new" ]; then sensitive "Install lifecycle script added or changed in ${f}: ${new}"; fi
            new=$(git show "${head}:${f}" | deps_of)
            old=$( { git show "${mb}:${f}" 2>/dev/null || echo '{}'; } | deps_of) || old=''
            if [ "$old" != "$new" ]; then sensitive "Dependency from git, a URL or a local path, or pnpm build settings, changed in ${f}"; fi
          done < <(git -c core.quotePath=false diff -z --name-only --diff-filter=AMR "${base}...${head}" -- '*package.json')

          # 4. Other files that run code on install: npm/yarn config, pnpm hooks and git hooks.
          while IFS= read -r -d '' f; do
            if [[ "$f" =~ (^|/)(\.?pnpmfile\.[cm]?js|\.npmrc|\.yarnrc(\.yml)?)$ || "$f" =~ ^\.husky/ ]]; then
              sensitive "Install configuration changed: ${f}"
            fi
          done < <(git -c core.quotePath=false diff -z --name-only "${base}...${head}")

          # 5. pnpm-workspace.yaml: build and hook settings, and new dependencies from git, URLs or paths.
          build_keys_of() {
            awk '/^[^[:space:]#]/ { keep = ($0 ~ /^(allowBuilds|onlyBuiltDependencies|neverBuiltDependencies|ignoredBuiltDependencies|dangerouslyAllowAllBuilds|pnpmfile|globalPnpmfile)[[:space:]]*:/) } keep'
          }
          specs_of() { grep -oE ":[[:space:]]*[\"']?${remote_spec}[^\"' ]+" | sort -u || true; }
          while IFS= read -r -d '' f; do
            if [ "$(git show "${mb}:${f}" 2>/dev/null | build_keys_of)" != "$(git show "${head}:${f}" | build_keys_of)" ]; then
              sensitive "pnpm build or hook settings changed in ${f}"
            fi
            added_specs=$(comm -13 <(git show "${mb}:${f}" 2>/dev/null | specs_of) <(git show "${head}:${f}" | specs_of))
            if [ -n "$added_specs" ]; then sensitive "Dependency from git, a URL or a local path added in ${f}"; fi
          done < <(git -c core.quotePath=false diff -z --name-only --diff-filter=AMR "${base}...${head}" -- '*pnpm-workspace.yaml')

          # 6. Public IPv4 addresses in URLs (any scheme, any case, or "//IP") or after network
          #    tools. Exfiltration endpoints often use them. A bare a.b.c.d is not matched,
          #    because version numbers look the same.
          ip='([0-9]{1,3}\.){3}[0-9]{1,3}'
          ips=$(printf '%s\n' "$added" \
            | grep -oiE "([a-z][a-z0-9+.-]*:)?//${ip}|(^|[^a-z0-9_])(curl|wget|nc|ncat|socat|telnet|ssh|scp|sftp)[[:space:]][^;|&]*${ip}" \
            | grep -oE "$ip" \
            | awk -F. '$1<=255 && $2<=255 && $3<=255 && $4<=255 && !($1==0 || $1==10 || $1==127 || ($1==169 && $2==254) || ($1==192 && $2==168) || ($1==172 && $2>=16 && $2<=31))' \
            | sort -u || true)
          if [ -n "$ips" ]; then
            sensitive "Public IP address added: $(printf '%s' "$ips" | tr '\n' ' ')"
          fi

          if [ "$fail" = 0 ]; then echo "No compromised commits and no sensitive changes found."; fi
          exit "$fail"
