name: Dev Release

# Publishes all packages from the selected branch as `<next version>-dev.<run number>`,
# e.g. `10.0.2-dev.42`. The run number is unique across all branches, so dev releases
# from different branches never collide. Pick the branch in "Use workflow from".
on:
  workflow_dispatch:
    inputs:
      releaseType:
        description: "Version the dev release leads up to"
        required: true
        type: choice
        default: "patch"
        options:
          - patch
          - minor
          - major
      distTag:
        description: "NPM dist-tag"
        required: true
        type: string
        default: "next"

concurrency:
  group: dev-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NPM_CONFIG_PROVENANCE: true

jobs:
  authorize:
    name: Authorize Actor
    uses: ./.github/workflows/authorize-publisher.yml
    secrets: inherit
  release:
    permissions:
      contents: read
      id-token: write
      packages: read
    needs: [authorize]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Git Setup
        run: |
          git config --global user.email "bot@webdriver.io"
          git config --global user.name "WebdriverIO Release Bot"
      - name: Install Dependencies
        run: pnpm install
      - name: Compute Dev Version
        id: version
        run: pnpm -r --filter=@wdio/release run dev-version
        env:
          RELEASE_TYPE: ${{ inputs.releaseType }}
          DIST_TAG: ${{ inputs.distTag }}
      - name: Build
        run: pnpm run setup
        env:
          NODE_ENV: production
      - name: Release
        # `--ignore-scripts` skips the root `version` script, which would otherwise
        # write CHANGELOG.md and create a GitHub release for the dev version.
        # `--no-git-tag-version` keeps dev versions out of git: no commit, no tag, no push.
        run: |
          pnpm -r --filter=@wdio/lerna-patch run patch
          pnpm lerna publish "$VERSION" --exact --yes --force-publish --no-git-tag-version --no-push --ignore-scripts --dist-tag "$DIST_TAG"
        env:
          NODE_ENV: production
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.distTag }}
      - name: Summary
        run: |
          {
            echo "### Published \`$VERSION\` from \`$GITHUB_REF_NAME\`"
            echo
            echo '```sh'
            echo "npm install webdriverio@$VERSION @wdio/cli@$VERSION"
            echo '```'
            echo
            echo "The \`$DIST_TAG\` dist-tag now points to this version."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.distTag }}
