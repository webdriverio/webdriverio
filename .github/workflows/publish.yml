name: Manual NPM Publish

on:
  workflow_dispatch:
    inputs:
      releaseType:
        description: "Release Type"
        required: true
        type: choice
        default: "patch"
        options:
          - patch
          - minor
          - major
          - premajor
      distTag:
        description: 'NPM tag (add "--force-publish" to release all packages). Dev releases use "next" when this is "latest"'
        required: true
        default: 'latest'
      dev:
        description: "Dev release: publish all packages from the selected branch as <next version>-dev.<run number>, without git tag or changelog"
        required: false
        type: boolean
        default: false

env:
  NPM_CONFIG_PROVENANCE: true

jobs:
  authorize:
    name: Authorize Actor
    uses: ./.github/workflows/authorize-publisher.yml
    secrets: inherit
  release:
    permissions:
      contents: write
      id-token: write
      packages: read
    needs: [authorize]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Git Setup
        run: |
          git config --global user.email "bot@webdriver.io"
          git config --global user.name "WebdriverIO Release Bot"
      - name: Install Dependencies
        run: pnpm install
      - name: Compute Dev Version
        if: ${{ inputs.dev }}
        id: devVersion
        run: pnpm -r --filter=@wdio/release run dev-version
        env:
          RELEASE_TYPE: ${{ inputs.releaseType }}
          # dev releases never move `latest`, so the default falls back to `next`
          DIST_TAG: ${{ inputs.distTag == 'latest' && 'next' || inputs.distTag }}
      - name: Build
        run: pnpm run setup
        env:
          NODE_ENV: production
      - name: Release
        if: ${{ !inputs.dev }}
        run: |
          pnpm -r --filter=@wdio/lerna-patch run patch
          pnpm lerna publish ${{github.event.inputs.releaseType}} --exact --yes --dist-tag ${{github.event.inputs.distTag}}
          pnpm run pushReleaseTag
        env:
          NODE_ENV: production
          GITHUB_AUTH: ${{ secrets.GITHUB_TOKEN }}
      - name: Dev Release
        if: ${{ inputs.dev }}
        # `--ignore-scripts` skips the root `version` script, which would otherwise
        # write CHANGELOG.md and create a GitHub release for the dev version.
        # `--no-git-tag-version` keeps dev versions out of git: no commit, no tag, no push.
        run: |
          pnpm -r --filter=@wdio/lerna-patch run patch
          pnpm lerna publish "$VERSION" --exact --yes --force-publish --no-git-tag-version --no-push --ignore-scripts --dist-tag "$DIST_TAG"
          {
            echo "### Published \`$VERSION\` from \`$GITHUB_REF_NAME\`"
            echo
            echo '```sh'
            echo "npm install webdriverio@$VERSION @wdio/cli@$VERSION"
            echo '```'
            echo
            echo "The \`$DIST_TAG\` dist-tag now points to this version."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          NODE_ENV: production
          VERSION: ${{ steps.devVersion.outputs.version }}
          DIST_TAG: ${{ steps.devVersion.outputs.distTag }}
