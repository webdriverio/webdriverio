name: Component Tests

on:
  workflow_call:
    inputs:
      full_matrix:
        description: Run every supported Node version on macOS. When false, PRs run a single Node version.
        type: boolean
        default: true

jobs:
  check:
    name: Component Test (${{ matrix.os }}.${{ matrix.node }})
    permissions:
      contents: read
      actions: write
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Windows cells were kept in the matrix even though the test step was
        # skipped (https://github.com/webdriverio/webdriverio/actions/runs/9075112951/job/24935302330#step:7:30).
        # They only burned checkout/install minutes, so they are omitted.
        # Ubuntu is still disabled — the suite has historically been macOS-only
        # in this workflow besides the skipped Windows jobs.
        node: ${{ fromJSON(inputs.full_matrix && '["20","22","24","26"]' || '["24"]') }}
        os: ['macos-latest']
    runs-on: ${{ matrix.os }}
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🧑‍🔧 Get Core Dependencies
        uses: ./.github/workflows/actions/get-core-dependencies

      - name: 🐢 Setup Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Download Build Archive
        uses: ./.github/workflows/actions/download-archive
        with:
          name: webdriverio
          path: .
          filename: webdriverio-build.zip

      - name: Component Tests
        run: pnpm run test:component
        shell: bash

      - name: Check Git Context
        uses: ./.github/workflows/actions/check-git-context

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: component-tests-${{ matrix.os }}-${{ matrix.node }}-logs
          path: e2e/browser-runner/logs
