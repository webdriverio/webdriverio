name: create-wdio E2E Tests

on:
  workflow_call:
    # Make this a reusable workflow, no value needed
    # https://docs.github.com/en/actions/using-workflows/reusing-workflows

jobs:
  create_wdio:
    name: create-wdio E2E Test (${{ matrix.os }}, ${{ matrix.pm }})
    permissions:
      contents: read
    # more than the test timeouts (4 x 5 min) and the setup steps, so that Vitest reports a stuck setup
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        # npm runs 4 setups; pnpm, Yarn and Bun (their latest release) run web and android
        pm: [npm, pnpm, yarn, bun]
    runs-on: ${{ matrix.os }}
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🧑‍🔧 Get Core Dependencies
        uses: ./.github/workflows/actions/get-core-dependencies

      - name: Download Build Archive
        uses: ./.github/workflows/actions/download-archive
        with:
          name: webdriverio
          path: .
          filename: webdriverio-build.zip

      # `<pm> create wdio` with the local create-wdio wizard: web (with the generated example test),
      # Android, and with npm also iOS and macOS (the Appium installs)
      - name: create-wdio E2E Test
        run: pnpm run test:e2e:create-wdio
        env:
          CREATE_WDIO_PM: ${{ matrix.pm }}
        shell: bash
