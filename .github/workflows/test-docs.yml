# Builds the documentation website on pull requests.
#
# The docs site is otherwise only ever built by `deploy.yml`, which is manually
# dispatched — so a broken Docusaurus config, plugin or MDX page could only be
# discovered at deploy time.
#
# Translations are disabled in website/docusaurus.config.ts until
# webdriverio/i18n is updated, so only `en` is generated and built. Once they
# are back, build a non-English locale here again (e.g. `--locale en --locale ar`
# in a single invocation): translated pages lag behind the English source, and
# an `en`-only build cannot catch one referencing an MDX component that no
# longer exists.
name: Docs Build

on:
  workflow_call:

jobs:
  docs_build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the sitemap plugin can write <lastmod> from git.
          fetch-depth: 0

      - name: 🧑‍🔧 Get Core Dependencies
        uses: ./.github/workflows/actions/get-core-dependencies

      # Docs-only PRs are excluded from the unit-test lane. Compile the
      # packages the Vitest setup imports, then run @wdio/docs tests here.
      - name: 🧪 Docs package unit tests
        run: |
          pnpm -r --filter=@wdio/compiler run build -p @wdio/logger -p @wdio/types -p @wdio/utils
          pnpm exec vitest --config vitest.config.ts --run infra/docs

      - name: 📖 Generate Docs
        run: pnpm run docs:setup && pnpm run docs:generate
        env:
          # Translations are disabled; skip the webdriverio/i18n download.
          DOCS_ENGLISH_ONLY: '1'
          GITHUB_AUTH: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build Site (en)
        run: pnpm run build:en
        working-directory: ./website

      - name: ✅ Verify Machine-Readable Output
        run: |
          set -euo pipefail
          for f in robots.txt llms.txt llms-full.txt sitemap.xml; do
            test -s "website/build/$f" || { echo "::error::website/build/$f missing or empty"; exit 1; }
            echo "ok: website/build/$f ($(wc -c < "website/build/$f") bytes)"
          done
          for f in website/build/llms/*.txt; do
            test -s "$f" || { echo "::error::$f is empty"; exit 1; }
          done
          echo "ok: $(ls website/build/llms/*.txt | wc -l) llms section bundles"
          grep -q '<lastmod>' website/build/sitemap.xml || { echo "::error::sitemap.xml has no <lastmod> entries"; exit 1; }
          echo "ok: sitemap.xml contains $(grep -c '<lastmod>' website/build/sitemap.xml) <lastmod> entries"

      # Sidebar coverage, URL preservation against website/url-baseline.txt
      # (via the redirects in website/vercel.json) and llms.txt link integrity.
      - name: 🔗 Check Docs Structure and URLs
        run: pnpm run docs:check

      # Retrieval eval: the docs search (shared with the docs MCP server) must
      # find an expected page in the top 5 for most tasks in website/evals.
      - name: 🧪 Docs Retrieval Eval
        run: pnpm run docs:eval -- --min-hit-rate=0.8
