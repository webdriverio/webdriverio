name: Session E2E Tests

on:
  workflow_call:

jobs:
  check:
    name: Session E2E Tests (ubuntu)
    permissions:
      contents: read
      actions: write
    # Local run is about 7 minutes. Cold driver and Electron downloads on a
    # fresh runner need more room; files cannot share a browser.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🧑‍🔧 Get Core Dependencies
        uses: ./.github/workflows/actions/get-core-dependencies

      - name: Download Build Archive
        uses: ./.github/workflows/actions/download-archive
        with:
          name: webdriverio
          path: .
          filename: webdriverio-build.zip

      # Electron sessions are not headless. With no DISPLAY, the daemon starts
      # @wdio/display-server, which needs Xvfb. Recording encodes with ffmpeg.
      # Hosted Ubuntu images usually already have Xvfb and not ffmpeg.
      # The Azure apt mirror is sometimes very slow, and apt moves to the next
      # mirror only on an error: after 4 minutes, download without it.
      - name: Ensure Xvfb and ffmpeg
        timeout-minutes: 15
        run: |
          missing=()
          command -v Xvfb >/dev/null || missing+=(xvfb)
          command -v ffmpeg >/dev/null || missing+=(ffmpeg)
          if [ "${#missing[@]}" -eq 0 ]; then
            exit 0
          fi
          sudo apt-get update
          if ! sudo timeout 240 apt-get install -y --download-only "${missing[@]}"; then
            echo "::warning::Slow apt download, retrying without the Azure mirror"
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            fi
            sudo apt-get update
            sudo timeout 480 apt-get install -y --download-only "${missing[@]}"
          fi
          sudo apt-get install -y --no-download "${missing[@]}"

      # pnpm runs dependency build scripts only for `sharp`, so Electron's
      # postinstall never downloads dist/electron. electron.test.ts launches
      # that binary.
      - name: Install Electron
        run: node e2e/node_modules/electron/install.js

      - name: Session E2E Tests
        run: pnpm run test:e2e:session
        shell: bash

      - name: Check Git Context
        uses: ./.github/workflows/actions/check-git-context
