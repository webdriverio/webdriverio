name: Smoke Tests

on:
  workflow_call:
    inputs:
      full_matrix:
        description: Run every OS × Node combination. When false, PRs test Linux on the minimum and current LTS plus one Windows and one macOS cell.
        type: boolean
        default: true

jobs:
  check:
    name: Smoke Test (${{ matrix.os }}.${{ matrix.node }})
    permissions:
      contents: read
      actions: write
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Full: 4 Node versions × 3 OS. PR: Linux on the engine minimum and
        # current LTS, plus a single Windows and macOS cell.
        node: ${{ fromJSON(inputs.full_matrix && '["20","22","24","26"]' || '["20","24"]') }}
        os: ${{ fromJSON(inputs.full_matrix && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
        # Redundant ubuntu/20 entry when full_matrix is true — include cannot be [].
        include: ${{ fromJSON(inputs.full_matrix && '[{"os":"ubuntu-latest","node":"20"}]' || '[{"os":"windows-latest","node":"24"},{"os":"macos-latest","node":"24"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🧑‍🔧 Get Core Dependencies
        uses: ./.github/workflows/actions/get-core-dependencies

      - name: 🐢 Setup Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: 📦 Download Build Archive
        uses: ./.github/workflows/actions/download-archive
        with:
          name: webdriverio
          path: .
          filename: webdriverio-build.zip

      - name: 🧪 Smoke Tests
        run: pnpm run test:smoke
        shell: bash

      - name: 🔍 Check Git Context
        if: matrix.os != 'windows-latest'
        uses: ./.github/workflows/actions/check-git-context
