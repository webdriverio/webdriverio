# DEBUG BRANCH, DO NOT MERGE.
#
# Runs only the E2E launch tests, with every browser of `wdio.local.conf.ts`
# on one runner at the same time, as before #15901. On macOS this made tests
# hang until the Mocha timeout. This branch collects the logs to find why.
name: Test

on:
  push:
    branches:
      - ci/launch-all-browsers-one-runner
  pull_request:
    branches-ignore:
      - 'l10n_main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_core:
    name: Build
    uses: ./.github/workflows/build.yml

  launch_tests:
    name: Launch Tests
    needs: [build_core]
    uses: ./.github/workflows/test-launch.yml
