# Orchestrates the WebdriverIO test pipeline.
#
# Pull requests detect which areas changed and skip expensive suites that
# cannot be affected (display-server distro matrix, component tests, session
# e2e, docs site build, etc.). PRs also use a reduced OS × Node matrix and a
# subset of the display-server cells. Pushes to main/v10 (and PRs that touch CI
# config) still run the full matrix so merge coverage stays complete.
#
# Typical PR (e.g. a webdriverio package change): ~25 jobs instead of ~70.
name: Test

on:
  push:
    branches:
      - main
      - v10
      - '!l10n_main'
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches-ignore:
      - 'l10n_main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Full suite + full matrix: every push, or a PR that touches CI/root config.
      run-all: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ci == 'true' }}
      docs: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docs == 'true' }}
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
      component: ${{ github.event_name != 'pull_request' || steps.filter.outputs.component == 'true' }}
      session: ${{ github.event_name != 'pull_request' || steps.filter.outputs.session == 'true' }}
      display_server: ${{ github.event_name != 'pull_request' || steps.filter.outputs.display_server == 'true' }}
      display_server_images: ${{ github.event_name != 'pull_request' || steps.filter.outputs.display_server_images == 'true' }}
      chromedriver: ${{ github.event_name != 'pull_request' || steps.filter.outputs.chromedriver == 'true' }}
    steps:
      - name: 🔎 Filter changed paths
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # exclusions are final; by default each '!' pattern matches every file outside it
          predicate-quantifier: some-with-excludes
          filters: |
            ci:
              - '.github/workflows/**'
              - '.nvmrc'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'lerna.json'
              - 'tsconfig.json'
              - 'vitest.config.ts'
              - '.oxlintrc.json'
            docs:
              - 'website/**'
              - 'infra/docs/**'
            component:
              - 'packages/wdio-browser-runner/**'
              - 'e2e/browser-runner/**'
            session:
              - 'packages/wdio-session/**'
              - 'packages/wdio-snapshot/**'
              - 'e2e/session/**'
            display_server:
              - 'packages/wdio-display-server/**'
              - 'packages/wdio-local-runner/**'
              - 'e2e/wdio/display-server/**'
            # Most distro images only build in the full display-server matrix.
            display_server_images:
              - 'e2e/wdio/display-server/docker/**'
            chromedriver:
              - 'packages/wdio-utils/src/node/utils.ts'
              - 'packages/wdio-utils/src/node/electronChromedriverProvider.ts'
              - 'packages/wdio-utils/src/node/startWebDriver.ts'
              - 'packages/wdio-utils/src/node/manager.ts'
              - 'packages/wdio-utils/package.json'
              - 'e2e/wdio/chromedriver/**'
            # Core product / test code. Display-server, browser-runner, and session
            # trees are excluded so those dedicated suites can run on their own.
            code:
              - 'packages/**'
              - '!packages/wdio-display-server/**'
              - '!packages/wdio-browser-runner/**'
              - '!packages/wdio-session/**'
              - '!packages/wdio-snapshot/**'
              - 'tests/**'
              - 'e2e/**'
              - '!e2e/wdio/display-server/**'
              - '!e2e/browser-runner/**'
              - '!e2e/session/**'
              - '!e2e/wdio/chromedriver/**'
              - 'infra/**'
              # @wdio/docs unit tests run in the docs workflow. Leaving this
              # package out of the code lane keeps smoke and e2e off a docs-only PR.
              - '!infra/docs/**'
              - '@types/**'
              - '__mocks__/**'

  build_core:
    name: Build
    needs: [changes]
    if: needs.changes.outputs.run-all == 'true' || needs.changes.outputs.code == 'true' || needs.changes.outputs.component == 'true' || needs.changes.outputs.session == 'true' || needs.changes.outputs.display_server == 'true' || needs.changes.outputs.chromedriver == 'true'
    uses: ./.github/workflows/build.yml

  static_code_analysis:
    name: Static Code Analysis
    uses: ./.github/workflows/test-static.yml

  docs_build:
    name: Docs Build
    needs: [changes, static_code_analysis]
    if: needs.changes.outputs.run-all == 'true' || needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/test-docs.yml

  typing_tests:
    name: Typing Tests
    needs: [changes, build_core, static_code_analysis]
    if: needs.changes.outputs.run-all == 'true' || needs.changes.outputs.code == 'true' || needs.changes.outputs.component == 'true'
    uses: ./.github/workflows/test-typings.yml

  interop_tests:
    name: Interop Tests
    needs: [changes, build_core, static_code_analysis]
    if: needs.changes.outputs.run-all == 'true' || needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/test-interop.yml

  unit_tests:
    name: Unit Tests
    needs: [changes, build_core, static_code_analysis]
    if: needs.changes.outputs.run-all == 'true' || needs.changes.outputs.code == 'true' || needs.changes.outputs.component == 'true' || needs.changes.outputs.session == 'true' || needs.changes.outputs.display_server == 'true'
    uses: ./.github/workflows/test-unit.yml
    with:
      full_matrix: ${{ needs.changes.outputs.run-all == 'true' }}

  smoke_tests:
    name: Smoke Tests
    needs: [changes, build_core, static_code_analysis]
    if: needs.changes.outputs.run-all == 'true' || needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/test-smoke.yml
    with:
      full_matrix: ${{ needs.changes.outputs.run-all == 'true' }}

  component_tests:
    name: Component Tests
    needs: [changes, build_core, static_code_analysis]
    if: needs.changes.outputs.run-all == 'true' || needs.changes.outputs.component == 'true'
    uses: ./.github/workflows/test-component.yml
    with:
      full_matrix: ${{ needs.changes.outputs.run-all == 'true' }}

  # Same start gate as component tests, so this runs beside unit tests and the
  # later e2e jobs instead of waiting for them. Ubuntu only: lifecycle and
  # Electron tests inspect /proc.
  session_tests:
    name: Session E2E Tests
    needs: [changes, build_core, static_code_analysis]
    if: needs.changes.outputs.run-all == 'true' || needs.changes.outputs.session == 'true'
    uses: ./.github/workflows/test-session.yml

  launch_tests:
    name: E2E Tests
    needs: [changes, smoke_tests, unit_tests, interop_tests, typing_tests]
    if: needs.changes.outputs.run-all == 'true' || needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/test-launch.yml

  cloud_tests:
    name: Cloud E2E Tests
    needs: [changes, smoke_tests, unit_tests, interop_tests, typing_tests]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v10') && (needs.changes.outputs.run-all == 'true' || needs.changes.outputs.code == 'true')
    uses: ./.github/workflows/test-cloud.yml
    secrets: inherit

  testrunner_tests:
    name: Testrunner E2E Tests
    needs: [changes, smoke_tests, unit_tests, interop_tests, typing_tests]
    if: needs.changes.outputs.run-all == 'true' || needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/test-testrunner.yml

  multi_remote_tests:
    name: Multi-remote E2E Tests
    needs: [changes, smoke_tests, unit_tests, interop_tests, typing_tests]
    if: needs.changes.outputs.run-all == 'true' || needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/test-multiremote.yml

  standalone_tests:
    name: Standalone E2E Tests
    needs: [changes, smoke_tests, unit_tests, interop_tests, typing_tests]
    if: needs.changes.outputs.run-all == 'true' || needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/test-standalone.yml

  display_server_tests:
    name: Display Server E2E Tests
    needs: [changes, build_core, static_code_analysis]
    if: needs.changes.outputs.run-all == 'true' || needs.changes.outputs.display_server == 'true'
    uses: ./.github/workflows/test-display-server.yml
    with:
      full_matrix: ${{ needs.changes.outputs.run-all == 'true' || needs.changes.outputs.display_server_images == 'true' }}

  chromedriver_tests:
    name: Chromedriver E2E Tests
    needs: [changes, build_core, static_code_analysis]
    if: needs.changes.outputs.run-all == 'true' || needs.changes.outputs.chromedriver == 'true'
    uses: ./.github/workflows/test-chromedriver.yml

  # Stable required check. Individual matrix cells are skipped on most PRs;
  # this job succeeds when every job that *did* run succeeded (skipped is OK).
  ci:
    name: CI
    if: always() && !cancelled()
    needs:
      - changes
      - build_core
      - static_code_analysis
      - docs_build
      - typing_tests
      - interop_tests
      - unit_tests
      - smoke_tests
      - component_tests
      - session_tests
      - launch_tests
      - cloud_tests
      - testrunner_tests
      - multi_remote_tests
      - standalone_tests
      - display_server_tests
      - chromedriver_tests
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if any required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more CI jobs failed or were cancelled."
          exit 1
