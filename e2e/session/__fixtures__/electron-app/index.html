<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Session Fixture App</title>
</head>
<body>
  <h1>Counter</h1>
  <p>Count: <span id="count">0</span></p>
  <button id="increment" type="button" onclick="document.getElementById('count').textContent = String(Number(document.getElementById('count').textContent) + 1)">Increment</button>
</body>
</html>
