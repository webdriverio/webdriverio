<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Combobox Fixture</title>
</head>
<body>
    <main>
        <h1>Search</h1>
        <div class="aa-Autocomplete" role="combobox" aria-expanded="false" aria-haspopup="listbox" aria-labelledby="autocomplete-0-label">
            <form class="aa-Form" role="search" onsubmit="return false">
                <div class="aa-InputWrapperPrefix">
                    <label id="autocomplete-0-label" for="autocomplete-0-input">Search the shop</label>
                    <button type="submit" title="Submit">Go</button>
                </div>
                <div class="aa-InputWrapper">
                    <input class="aa-Input" id="autocomplete-0-input" type="search" aria-autocomplete="list" aria-labelledby="autocomplete-0-label" autocomplete="off">
                </div>
            </form>
        </div>
    </main>
</body>
</html>
