<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dialogs Fixture</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Pick your dates</h1>
    <ul>
      <li>Harbor view room from $120 <a href="/index.html">Book now</a></li>
      <li>Garden suite from $240 <a href="/index.html">Book now</a></li>
    </ul>
    <div class="field">
      <label for="in">Check In</label>
      <input id="in" type="text">
      <div role="dialog" aria-label="Check In">
        <h2>Check In</h2>
        <button type="button">Previous Month</button>
        <button type="button">Next Month</button>
        <button type="button">Choose Monday, 28 September 2026</button>
        <button type="button">Choose Tuesday, 29 September 2026</button>
        <button type="button">Choose Wednesday, 30 September 2026</button>
      </div>
    </div>
    <div class="field">
      <label for="out">Check Out</label>
      <input id="out" type="text">
      <div role="dialog" aria-label="Check Out">
        <h2>Check Out</h2>
        <button type="button">Previous Month</button>
        <button type="button">Next Month</button>
        <button type="button">Choose Monday, 28 September 2026</button>
        <button type="button">Choose Tuesday, 29 September 2026</button>
        <button type="button">Choose Wednesday, 30 September 2026</button>
      </div>
    </div>
  </main>
</body>
</html>
