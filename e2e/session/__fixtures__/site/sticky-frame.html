<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sticky Frame Fixture</title>
  <style>
    body { margin: 0; }
    nav { position: fixed; top: 0; left: 0; right: 0; height: 80px; background: #223; color: #fff; }
    button { position: absolute; top: 40px; left: 20px; height: 60px; width: 200px; }
  </style>
</head>
<body>
  <nav aria-label="Main">Shady Meadows</nav>
  <button type="button" onclick="this.textContent = 'Frame clicked'">Frame action</button>
</body>
</html>
