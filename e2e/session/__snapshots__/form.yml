- document "Form Fixture" url=http://localhost:PORT/form.html
  - main
    - heading "Sign up" [level=1]
    - textbox "Email" [ref=e9] [required]
    - textbox "Password" [ref=e10] value="••••"
    - checkbox "Remember me" [ref=e11] [checked]
    - group "Plan"
      - radio "Free" [ref=e12] [checked]
      - radio "Pro" [ref=e13]
    - combobox "Country" [ref=e14] value="Germany"
    - spinbutton "Quantity" [ref=e15] value="1" [min=1] [max=9]
    - textbox "Your message" [ref=e16]
    - textbox "Avatar" [ref=e17]
    - textbox "Account id" [ref=e18] value="A-1" [readonly]
    - button "Delete account" [ref=e19] [disabled]
    - button "Submit" [ref=e20]
    - text "Hover me"
    - button "Drag me" [ref=e21]
    - region "Drop zone" [ref=e22]
    - textbox "Key log" [ref=e23]
    - button "Bottom button" [ref=e24]
