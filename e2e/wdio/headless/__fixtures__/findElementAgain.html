<!DOCTYPE html>
<html>
<head>
    <title>Find Element Again</title>
</head>
<body>
    <div id="late-area"></div>
    <ul id="items"><li class="item">first</li></ul>
    <div id="host"></div>
    <div id="form-area"><form id="form"><p class="in-form">first</p><input type="date" class="date"></form></div>
    <div id="dates"><input type="date" class="date"><input type="date" class="date"></div>
    <div id="date-host-area"></div>
    <div id="select-area"><select id="select"><option value="a">Alpha</option><option value="b">Beta</option></select></div>

    <script>
        const root = document.querySelector('#host').attachShadow({ mode: 'open' })
        root.innerHTML = '<p class="in-shadow">first</p>'

        const elements = (tagName, className, texts) => texts.map((text) => {
            const el = document.createElement(tagName)
            el.className = className
            el.textContent = text
            return el
        })

        /**
         * add `.late` elements after the spec looked them up, so the element
         * has no id and is found again
         */
        window.renderLate = (count) => {
            const texts = Array.from({ length: count }, (_, i) => `late ${i + 1}`)
            document.querySelector('#late-area').replaceChildren(...elements('p', 'late', texts))
        }

        /**
         * replace every `.item` with new nodes, so an element found before
         * is stale and is found again
         */
        window.renderItems = (texts) => {
            document.querySelector('#items').replaceChildren(...elements('li', 'item', texts))
        }

        /**
         * replace `#form` and its content with new nodes, as a framework does when it
         * mounts a form again (e.g. a React form with a new `key`)
         */
        window.renderForm = (text) => {
            const form = document.createElement('form')
            form.id = 'form'
            form.append(...elements('p', 'in-form', [text]))
            const date = document.createElement('input')
            date.type = 'date'
            date.className = 'date'
            form.append(date)
            document.querySelector('#form-area').replaceChildren(form)
        }

        /**
         * replace every date input of `#dates` with new nodes
         */
        window.renderDates = () => {
            const dates = document.querySelector('#dates')
            dates.replaceChildren(...[...dates.children].map((el) => el.cloneNode(true)))
        }

        /**
         * replace `#date-host` (a shadow host with a date input) with a new host
         */
        window.renderDateHost = () => {
            const host = document.createElement('div')
            host.id = 'date-host'
            host.attachShadow({ mode: 'open' }).innerHTML = '<input type="date" class="date">'
            document.querySelector('#date-host-area').replaceChildren(host)
        }
        window.renderDateHost()

        /**
         * replace `#select` and its options with new nodes
         */
        window.renderSelect = () => {
            const select = document.querySelector('#select')
            select.replaceWith(select.cloneNode(true))
        }

        /**
         * replace the content of the shadow root of `#host` with new nodes
         */
        window.renderShadow = (className, texts) => {
            root.replaceChildren(...elements('p', className, texts))
        }
    </script>
</body>
</html>
