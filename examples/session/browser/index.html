<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Postcard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <p class="lamps" id="lamps">The lamps are on.</p>
  <main class="desk">
    <article class="card" id="card" data-phase="day" data-weather="clear" data-sent="false">
      <div class="sky">
        <div class="stars"></div>
        <div class="aurora"></div>
        <div class="sun"></div>
        <div class="moon"></div>
        <div class="snow"></div>
        <p class="clock" id="clock">UTC 00:00</p>
      </div>
      <div class="paper">
        <p class="kicker">Fieldglass</p>
        <h1 id="place">Somewhere unnamed</h1>
        <p class="written" id="written" hidden></p>
        <label class="message">
          <span aria-hidden="true">Message</span>
          <textarea id="note" aria-label="Message" rows="2" maxlength="80" placeholder="Wish you were here"></textarea>
        </label>
        <p class="stamp" id="stamp" hidden>TOKYO</p>
        <p class="seal" id="seal" hidden><span>Sent</span></p>
      </div>
    </article>
    <div class="controls">
      <button type="button" id="stamp-btn">Stamp the card</button>
      <button type="button" id="sky-btn">Look outside</button>
      <button type="button" id="send-btn">Send the card</button>
    </div>
    <p class="status" id="status" role="status">A blank card.</p>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
