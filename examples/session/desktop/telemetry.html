<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Telemetry</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="crt">
  <main>
    <p class="kicker">Telemetry</p>
    <p class="alt">Altitude <span id="alt">0</span> m</p>
    <p class="track" aria-hidden="true"><span id="fill"></span></p>
  </main>
  <script>
    const alt = document.querySelector('#alt')
    const fill = document.querySelector('#fill')
    const start = performance.now()
    function tick (now) {
      const meters = Math.floor((now - start) * 4)
      alt.textContent = String(meters)
      fill.style.height = Math.min(100, meters / 40) + '%'
      requestAnimationFrame(tick)
    }
    requestAnimationFrame(tick)
  </script>
</body>
</html>
