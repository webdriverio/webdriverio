packages:
  - 'packages/**'
  - 'infra/**'
  - 'website/**'
  - 'e2e/**'
  - 'tests/**'
  - 'tests/typings/**'
  - 'examples/wdio/**'
  - 'examples/standalone/**'
  - 'examples/pageobject/**'
  - 'examples/cloudservices/**'
  - 'examples/bidi/**'
  - 'examples/appium/**'
  - '!e2e/session/__fixtures__/**'

# only sharp runs its install script; the rest work without theirs
allowBuilds:
  sharp: true
  '@swc/core': false
  appium: false
  core-js: false
  edgedriver: false
  esbuild: false
  geckodriver: false
  nx: false

# expect-webdriverio v8 alpha was published inside pnpm's minimumReleaseAge
# window; allow it until the stable release lands.
minimumReleaseAgeExclude:
  - expect-webdriverio@8.0.0-alpha.0

# coverage-v8@5 accepts ^1.0.0. 1.0.2 was published inside pnpm's
# minimumReleaseAge window, so stay on the previous release.
overrides:
  '@vitest/istanbul-lib-coverage': 1.0.1
  '@vitest/istanbul-lib-report': 1.0.1
  # expect-webdriverio types import @wdio/types. The npm copy has the same version
  # as the workspace one, so tsc dedupes them to the npm copy without the v10 types.
  'expect-webdriverio>@wdio/types': 'workspace:*'

# recast's declared @babel/parser range cannot parse the pipeline operator
packageExtensions:
  recast@0.23.11:
    dependencies:
      '@babel/parser': 7.29.8
  recast@0.23.21:
    dependencies:
      '@babel/parser': 7.29.8
  recast@0.24.0:
    dependencies:
      '@babel/parser': 7.29.8
