packages:
  - 'packages/**'
  - 'infra/**'
  - 'website/**'
  - 'e2e/**'
  - 'tests/**'
  - 'tests/typings/**'
  - 'examples/wdio/**'
  - 'examples/standalone/**'
  - 'examples/pageobject/**'
  - 'examples/cloudservices/**'
  - 'examples/bidi/**'
  - 'examples/appium/**'
  - '!e2e/session/__fixtures__/**'

# only sharp runs its install script; the rest work without theirs
allowBuilds:
  sharp: true
  '@swc/core': false
  appium: false
  core-js: false
  edgedriver: false
  esbuild: false
  geckodriver: false
  nx: false

# expect-webdriverio v8 alpha was published inside pnpm's minimumReleaseAge
# window; allow it until the stable release lands.
minimumReleaseAgeExclude:
  - expect-webdriverio@8.0.0-alpha.0 || 8.0.0-alpha.1 || 8.0.0-alpha.2

# recast's declared @babel/parser range cannot parse the pipeline operator
packageExtensions:
  recast@0.23.11:
    dependencies:
      '@babel/parser': 7.29.8
  recast@0.23.21:
    dependencies:
      '@babel/parser': 7.29.8
  recast@0.24.0:
    dependencies:
      '@babel/parser': 7.29.8
