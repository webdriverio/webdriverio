packages:
  - 'packages/**'
  - 'infra/**'
  - 'website/**'
  - 'e2e/**'
  - 'tests/**'
  - 'tests/typings/**'
  - 'examples/wdio/**'
  - 'examples/standalone/**'
  - 'examples/pageobject/**'
  - 'examples/cloudservices/**'
  - 'examples/bidi/**'
  - 'examples/appium/**'
  - '!e2e/session/__fixtures__/**'

# only sharp runs its install script; the rest work without theirs
allowBuilds:
  sharp: true
  '@swc/core': false
  appium: false
  core-js: false
  edgedriver: false
  esbuild: false
  geckodriver: false
  nx: false

# first-party releases for v10 published inside pnpm's minimumReleaseAge window:
# expect-webdriverio 8.0.0 (2026-10-10) and the driver majors (2026-10-09). The
# entries can go once they are older than minimumReleaseAge.
minimumReleaseAgeExclude:
  - expect-webdriverio@8.0.0
  - edgedriver@8.0.0
  - geckodriver@8.0.0
  - safaridriver@3.0.0

# recast's declared @babel/parser range cannot parse the pipeline operator
packageExtensions:
  recast@0.23.11:
    dependencies:
      '@babel/parser': 7.29.8
  recast@0.23.21:
    dependencies:
      '@babel/parser': 7.29.8
  recast@0.24.0:
    dependencies:
      '@babel/parser': 7.29.8
