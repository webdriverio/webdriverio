<!doctype html>
<!--
    Source of website/static/img/social-card.jpg (og:image / twitter:image).
    Render from the website/ folder after `pnpm install`:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --hide-scrollbars --force-device-scale-factor=1 --allow-file-access-from-files \
      --window-size=1200,630 --virtual-time-budget=2000 \
      --screenshot=/tmp/social-card.png "file://$PWD/scripts/social-card.html"
    sips -s format jpeg -s formatOptions 85 /tmp/social-card.png --out static/img/social-card.jpg
-->
<html><head><meta charset="utf-8"><title>WebdriverIO social card</title><style>
@font-face{font-family:Inter;src:url("../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2");font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#0b0b0d}
.card{position:relative;width:1200px;height:630px;overflow:hidden;font-family:Inter,sans-serif;color:#fff;
  background:
    radial-gradient(1100px 620px at 85% 120%, rgba(234,89,6,.95), rgba(200,70,5,.45) 40%, transparent 72%),
    radial-gradient(800px 500px at 0% 0%, rgba(255,120,30,.55), transparent 65%),
    linear-gradient(155deg,#2a1206 0%,#0e0a09 50%,#2b1005 100%)}
.rays{position:absolute;inset:0;mix-blend-mode:screen;filter:blur(3px);
  background:repeating-conic-gradient(from 95deg at -6% -14%,
     rgba(255,170,110,0) 0deg, rgba(255,170,110,.0) 2.2deg, rgba(255,190,140,.55) 2.5deg, rgba(255,170,110,0) 2.9deg,
     rgba(255,170,110,0) 4.1deg, rgba(255,150,80,.25) 4.6deg, rgba(255,170,110,0) 5.6deg, rgba(255,170,110,0) 7.3deg);
  -webkit-mask-image:radial-gradient(1500px 1000px at -6% -14%, #000 0%, rgba(0,0,0,.6) 35%, transparent 72%)}
.rays.b{filter:blur(14px);opacity:.9;
  background:repeating-conic-gradient(from 100deg at -6% -14%, rgba(255,140,60,0) 0deg, rgba(255,140,60,.45) 3deg, rgba(255,140,60,0) 6deg, rgba(255,140,60,0) 11deg)}
.grain{position:absolute;inset:0;opacity:.32;mix-blend-mode:soft-light}
.content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
.brand{display:flex;align-items:center;gap:30px}
.brand svg{width:104px;height:104px;filter:drop-shadow(0 10px 30px rgba(234,89,6,.45))}
.name{font-size:108px;font-weight:750;letter-spacing:-.045em;line-height:1}
.tag{font-size:32px;font-weight:450;letter-spacing:-.015em;color:rgba(255,255,255,.88)}
</style></head><body><div class="card">
<div class="rays b"></div><div class="rays"></div>
<svg class="grain" width="1200" height="630"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div class="content">
  <div class="brand">
    <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="5" fill="#EA5906"/><path fill="#fff" d="M8,16 L8,48 L6,48 L6,16 L8,16 Z M43,16 C51.836556,16 59,23.163444 59,32 C59,40.836556 51.836556,48 43,48 C34.163444,48 27,40.836556 27,32 C27,23.163444 34.163444,16 43,16 Z M27,16 L14.106,47.9992078 L11.999,47.9992078 L24.894,16 L27,16 Z M43,18 C35.2680135,18 29,24.2680135 29,32 C29,39.7319865 35.2680135,46 43,46 C50.7319865,46 57,39.7319865 57,32 C57,24.2680135 50.7319865,18 43,18 Z"/></svg>
    <div class="name">WebdriverIO</div>
  </div>
  <div class="tag">Open source test automation for web, mobile and desktop apps</div>
</div></div></body></html>
