<!doctype html>
<!--
    Source of website/static/img/social-card.jpg (og:image / twitter:image).
    Render from the website/ folder after `pnpm install`:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --hide-scrollbars --force-device-scale-factor=1 --allow-file-access-from-files \
      --window-size=1200,630 --virtual-time-budget=2000 \
      --screenshot=/tmp/social-card.png "file://$PWD/scripts/social-card.html"
    sips -s format jpeg -s formatOptions 85 /tmp/social-card.png --out static/img/social-card.jpg
-->
<html><head><meta charset="utf-8"><title>WebdriverIO social card</title><style>
@font-face{font-family:Inter;src:url("../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2");font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#0b0b0d}
.card{position:relative;width:1200px;height:630px;overflow:hidden;font-family:Inter,sans-serif;color:#fff;
  background:radial-gradient(520px 420px at 50% 40%, rgba(234,89,6,.22), transparent 70%), #0b0b0d}
.grain{position:absolute;inset:0;opacity:.25;mix-blend-mode:soft-light}
.content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.robot{height:250px;margin-bottom:34px}
.mark{display:flex;align-items:center;gap:14px}
.word{font-size:92px;font-weight:200;letter-spacing:.07em;line-height:1;color:#f4f4f5}
.logo{width:68px;height:68px}
/* letter-spacing is set by the script below so the tagline matches the wordmark width */
.tag{margin-top:26px;font-size:17px;font-weight:300;white-space:nowrap;color:#a1a1aa}
</style></head><body><div class="card">
<svg class="grain" width="1200" height="630"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div class="content">
  <img class="robot" src="../static/img/materials/robot.svg" alt="">
  <div class="mark">
    <div class="word">WEBDRIVER</div>
    <img class="logo" src="../static/img/logo-webdriver-io.svg" alt="">
  </div>
  <div class="tag">TEST AUTOMATION FOR WEB, MOBILE &amp; DESKTOP</div>
</div></div>
<script>
document.fonts.ready.then(() => {
    const mark = document.querySelector('.mark')
    const tag = document.querySelector('.tag')
    // CSS adds letter-spacing after the last character too; cancel it with a negative margin
    const chars = tag.textContent.length
    let spacing = 0
    for (let i = 0; i < 20; i++) {
        tag.style.letterSpacing = `${spacing}px`
        tag.style.marginRight = `${-spacing}px`
        const diff = mark.getBoundingClientRect().width - (tag.getBoundingClientRect().width - spacing)
        if (Math.abs(diff) < 0.5) break
        spacing += diff / (chars - 1)
    }
    document.title = `mark=${mark.getBoundingClientRect().width.toFixed(1)} tag=${(tag.getBoundingClientRect().width - spacing).toFixed(1)} spacing=${spacing.toFixed(2)}`
})
</script>
</body></html>
