<!doctype html>
<!--
    Source of website/static/img/social-card.jpg (og:image / twitter:image).
    Render from the website/ folder after `pnpm install`:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --hide-scrollbars --force-device-scale-factor=1 --allow-file-access-from-files \
      --window-size=1200,630 --virtual-time-budget=2000 \
      --screenshot=/tmp/social-card.png "file://$PWD/scripts/social-card.html"
    sips -s format jpeg -s formatOptions 85 /tmp/social-card.png --out static/img/social-card.jpg
-->
<html><head><meta charset="utf-8"><title>WebdriverIO social card</title><style>
@font-face{font-family:Inter;src:url("../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2");font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#0b0b0d}
.card{position:relative;width:1200px;height:630px;overflow:hidden;font-family:Inter,sans-serif;color:#fff;
  background:
    radial-gradient(620px 520px at 88% 62%, rgba(234,89,6,.42), rgba(234,89,6,.12) 50%, transparent 75%),
    radial-gradient(700px 400px at 0% 0%, rgba(255,120,30,.16), transparent 70%),
    #0b0b0d}
.robot{position:absolute;right:-30px;top:40px;height:760px;opacity:.28;
  -webkit-mask-image:linear-gradient(100deg, transparent 0%, #000 38%, #000 100%)}
.grain{position:absolute;inset:0;opacity:.3;mix-blend-mode:soft-light}
.content{position:absolute;left:88px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:40px}
.mark{display:flex;align-items:center;gap:14px}
.word{font-size:108px;font-weight:200;letter-spacing:.07em;line-height:1;color:#f4f4f5}
.badge{width:96px;height:80px;border-radius:7px;background:#EA5906;display:flex;align-items:center;justify-content:center;transform:translateY(-2px)}
.badge svg{width:68px;height:68px}
.tag{max-width:640px;font-size:36px;font-weight:400;line-height:1.3;letter-spacing:-.01em;color:rgba(255,255,255,.82)}
</style></head><body><div class="card">
<img class="robot" src="../static/img/materials/robot.svg" alt="">
<svg class="grain" width="1200" height="630"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div class="content">
  <div class="mark">
    <div class="word">WEBDRIVER</div>
    <div class="badge"><svg viewBox="4 14 57 36"><path fill="#fff" d="M8,16 L8,48 L6,48 L6,16 L8,16 Z M43,16 C51.836556,16 59,23.163444 59,32 C59,40.836556 51.836556,48 43,48 C34.163444,48 27,40.836556 27,32 C27,23.163444 34.163444,16 43,16 Z M27,16 L14.106,47.9992078 L11.999,47.9992078 L24.894,16 L27,16 Z M43,18 C35.2680135,18 29,24.2680135 29,32 C29,39.7319865 35.2680135,46 43,46 C50.7319865,46 57,39.7319865 57,32 C57,24.2680135 50.7319865,18 43,18 Z"/></svg></div>
  </div>
  <div class="tag">Open source test automation for web, mobile and desktop apps</div>
</div></div></body></html>
